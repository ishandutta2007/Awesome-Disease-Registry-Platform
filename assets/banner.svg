<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: system-ui, -apple-system, sans-serif; font-size: 44px; font-weight: 800; fill: #ffffff; }
    .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 19px; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 600; fill: #38bdf8; }
    
    /* Dynamic Animated Elements in Background */
    @keyframes pulseLine {
      0% { stroke-dashoffset: 1000; opacity: 0.3; }
      50% { opacity: 0.9; }
      100% { stroke-dashoffset: 0; opacity: 0.3; }
    }
    
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.4; }
      50% { transform: translateY(-15px) scale(1.15); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.4; }
    }

    @keyframes ecgBeat {
      0% { stroke-dashoffset: 800; }
      100% { stroke-dashoffset: 0; }
    }

    .animated-ecg {
      stroke-dasharray: 800;
      animation: ecgBeat 6s linear infinite;
    }

    .p-1 { animation: floatParticle 4s ease-in-out infinite; }
    .p-2 { animation: floatParticle 5s ease-in-out infinite 1s; }
    .p-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
  </style>

  <!-- Base Card Area -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />
  <rect width="1196" height="346" x="2" y="2" rx="15" fill="none" stroke="#334155" stroke-width="2" />

  <!-- Background Dynamic Mesh & Flow Lines (Lower Z-Index) -->
  <g opacity="0.25">
    <circle cx="1000" cy="80" r="180" fill="#3b82f6" filter="url(#glow)" class="p-1" />
    <circle cx="150" cy="280" r="140" fill="#6366f1" filter="url(#glow)" class="p-2" />
    <circle cx="950" cy="270" r="120" fill="#ec4899" filter="url(#glow)" class="p-3" />
  </g>

  <!-- ECG Animated Pulse Line Background Component -->
  <path d="M 50,260 L 300,260 L 320,240 L 340,290 L 365,190 L 390,310 L 410,260 L 650,260 L 670,245 L 690,285 L 710,210 L 730,295 L 750,260 L 1150,260" 
        fill="none" stroke="url(#pulseGrad)" stroke-width="3" stroke-linecap="round" opacity="0.4" class="animated-ecg" />

  <!-- Foreground Title and Meta Content (Layered safely above graphics) -->
  <g transform="translate(60, 85)">
    <!-- Pill Category Badge -->
    <rect width="280" height="32" rx="16" fill="#1e293b" stroke="#0284c7" stroke-width="1.5" />
    <text x="20" y="21" class="badge-text">🏥 CLINICAL DATA &amp; REGISTRY ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="85" class="title">Awesome Disease Registry Platform 🩺</text>

    <!-- Subtitle -->
    <text x="0" y="125" class="subtitle">Curated SaaS Platforms, FHIR Open-Source Architecture &amp; Clinical Analytics</text>
    <text x="0" y="152" class="subtitle">Population Health Surveillance • Clinical Outcomes Measurement • Real-World Evidence</text>
  </g>

  <!-- Footer Decorative Badges / Tech Tags -->
  <g transform="translate(60, 275)">
    <rect width="110" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="12" y="17" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">⚡ HL7 FHIR</text>

    <rect x="125" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="137" y="17" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">📊 OpenMRS &amp; DHIS2</text>

    <rect x="270" width="130" height="26" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="282" y="17" font-family="system-ui" font-size="12" fill="#94a3b8" font-weight="600">📈 Population Health</text>
  </g>
</svg>
